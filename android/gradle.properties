org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Parallel + cached builds: the whisper_ggml plugin compiles whisper.cpp from
# source, which dominates build time. These flags let Gradle reuse work and
# saturate the runner's cores.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4
org.gradle.daemon=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
